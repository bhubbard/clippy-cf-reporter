[package]
name = "clippy-cf-reporter"
version = "0.1.0"
edition = "2021"
description = "Translates worker-rs Clippy diagnostics into Code Climate, SARIF v2.1.0, and GitHub Actions PR annotations"
authors = ["Brandon Hubbard"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
